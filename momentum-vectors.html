<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Momentum Vector Explorer</title><style>
:root{--navy:#102d4e;--blue:#176ca5;--cyan:#daf2ff;--lime:#def2e3;--ink:#173147;--muted:#547082;--line:#dce6ed;--bg:#f5f8fc;--white:#fff;--amber:#fff4dc}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}a{color:var(--blue)}header{background:linear-gradient(110deg,#102d4e,#17638b);color:#fff;padding:33px max(20px,calc((100% - 1080px)/2)) 30px}header h1{font-size:clamp(1.9rem,4vw,3rem);line-height:1.12;margin:12px 0 9px}header p{max-width:820px;margin:0;color:#e5f3fa}nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1100px;margin:auto;padding:13px 20px}nav a{text-decoration:none;font-weight:650}.crumb{font-size:.87rem;letter-spacing:.10em;text-transform:uppercase;font-weight:750;color:#d1eafa}.container{max-width:1100px;margin:auto;padding:18px 20px 55px}.kicker{color:var(--blue);letter-spacing:.08em;font-size:.83rem;font-weight:760;text-transform:uppercase}h2{font-size:1.55rem;margin:32px 0 12px;color:var(--navy)}h3{font-size:1.15rem;color:var(--navy);margin-top:20px}.card{background:var(--white);border:1px solid var(--line);border-radius:15px;padding:22px;margin:14px 0;box-shadow:0 3px 14px #102d4e08}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:14px}.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:19px}.tile a{font-weight:800;font-size:1.06rem}.muted{color:var(--muted)}.pill{display:inline-block;background:#e8f4fb;color:#125b88;padding:3px 9px;border-radius:999px;font-size:.8rem;font-weight:750}.future{opacity:.78}.future a{pointer-events:none;color:#516b79;text-decoration:none}.btn,button{background:var(--blue);color:#fff;padding:9px 13px;border-radius:9px;border:0;font:inherit;font-weight:700;cursor:pointer}.btn:hover,button:hover{filter:brightness(.93)}button.alt{background:#e7f1f7;color:var(--navy)}button:disabled{opacity:.50;cursor:not-allowed}input[type=text],input[type=number],select,textarea{border:1px solid #9cb3c4;border-radius:8px;padding:8px;font:inherit;max-width:100%}textarea{width:100%;min-height:64px}details{background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px 16px;margin:9px 0}summary{cursor:pointer;font-weight:700}.eq{font-size:1.2rem;font-weight:760;color:#174f79;background:#edf7ff;border-radius:9px;display:inline-block;padding:7px 12px}.boxnote{background:#eaf5fd;border-left:4px solid #2185bb;padding:15px 18px;margin:17px 0;border-radius:8px}.notice{background:#fff7e6;border-left:4px solid #e8a938;padding:15px 18px;margin:17px 0;border-radius:8px}.questions{counter-reset:q}.qcard{background:white;border:1px solid var(--line);border-radius:14px;margin:15px 0;padding:18px}.qhead{display:flex;align-items:flex-start;gap:10px}.qnum{background:#e5f2f9;color:#145780;border-radius:8px;padding:3px 9px;font-weight:800;white-space:nowrap}.qcard .feedback{margin-top:12px;display:none;background:#eaf6eb;border-left:4px solid #2d8b56;padding:11px;border-radius:7px}.qcard .hint{display:none;background:#fff7e6;border-left:4px solid #d8a530;padding:10px;margin-top:9px}.qcard .qactions{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.svggraph{width:100%;max-width:450px;display:block;margin:11px auto;border:1px solid #e0eaf2;border-radius:10px}.compact{font-size:.91rem}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:15px}.check{list-style:none;padding:0}.check li{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-bottom:1px solid #f0f4f8}.check input{margin-top:5px;accent-color:#0d7cab}.smallcap{font-size:.86rem;color:#526e7e}.resource{display:flex;gap:9px;align-items:center;padding:7px 0}.skip-link{position:absolute;left:-9999px}.skip-link:focus{left:12px;top:8px;background:white;color:#135b87;padding:8px}.foot{background:var(--navy);color:#e1edf5;padding:23px;text-align:center}.foot a{color:#b9e5ff}@media(max-width:700px){.card{padding:16px}header{padding:28px 19px}.container{padding:13px 15px 35px}}@media print{nav,button,.qactions{display:none!important}body{background:white;color:black}.card,.qcard{break-inside:avoid;box-shadow:none}.container{max-width:none}details{border:1px solid #ddd}.foot{background:white;color:black}}
.vec{display:inline-block;position:relative;vertical-align:baseline;white-space:nowrap}.vec::before{content:"→";position:absolute;font-size:.62em;left:0;right:0;text-align:center;top:-.65em;line-height:1} </style><style>body{background:#fff}.sim{max-width:1040px;margin:auto;padding:10px 15px}.toolbar{display:flex;flex-wrap:wrap;gap:13px;align-items:center}.controlgrid{display:grid;grid-template-columns:repeat(4,minmax(85px,1fr));gap:8px}.controlgrid label{font-size:.85rem}.controlgrid input{width:100%}.plot{border:1px solid #d2e1ec;border-radius:12px;background:#fff;width:100%;max-height:450px;touch-action:none}.legend{display:flex;flex-wrap:wrap;gap:13px}.value{font-variant-numeric:tabular-nums}.summary{background:#eef8fb;padding:10px;border-radius:9px}.smaller{font-size:.86rem} @media(max-width:460px){.controlgrid{grid-template-columns:repeat(2,1fr)}} .vec{display:inline-block;position:relative;vertical-align:baseline;white-space:nowrap}.vec::before{content:"→";position:absolute;font-size:.62em;left:0;right:0;text-align:center;top:-.65em;line-height:1} </style></head><body><div class="sim">
<h3 style="margin:7px 0">Momentum vectors · interactive explorer</h3><div class="toolbar"><label for="mode">Calculation mode: </label><select id="mode"><option value="change"><span class="vec">Δp</span> = <span class="vec">p</span> − <span class="vec">p</span>₀</option><option value="final"><span class="vec">p</span> = <span class="vec">p</span>₀ + <span class="vec">Δp</span></option></select><button class="alt" id="reset">Reset</button><button class="alt" id="preset">Next challenge</button></div>
<div class="controlgrid" style="margin:13px 0"><label>p₀ x (kg·m/s)<input type="number" id="x0" step="0.5" min="-8" max="8" value="3"></label><label>p₀ y (kg·m/s)<input type="number" id="y0" step="0.5" min="-8" max="8" value="1"></label><label><span id="targetX">p x</span> (kg·m/s)<input type="number" id="x1" step="0.5" min="-8" max="8" value="-1"></label><label><span id="targetY">p y</span> (kg·m/s)<input type="number" id="y1" step="0.5" min="-8" max="8" value="4"></label></div>
<svg id="plot" class="plot" viewBox="0 0 650 390" role="img" aria-label="Initial, final and difference momentum arrows on a coordinate grid">
<defs><marker id="arrowBlue" markerWidth="7" markerHeight="7" refX="5.6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#2172b7"/></marker><marker id="arrowGreen" markerWidth="7" markerHeight="7" refX="5.6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#11865f"/></marker><marker id="arrowOrange" markerWidth="7" markerHeight="7" refX="5.6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#d87719"/></marker></defs><g id="grid"></g><line id="blue" stroke="#2172b7" stroke-width="3.8" marker-end="url(#arrowBlue)"/><line id="green" stroke="#11865f" stroke-width="3.8" marker-end="url(#arrowGreen)"/><line id="orange" stroke="#d87719" stroke-width="3.8" marker-end="url(#arrowOrange)"/><circle id="hblue" r="9" fill="#2172b7" opacity="0.35" style="cursor:grab"/><circle id="hgreen" r="9" fill="#11865f" opacity="0.35" style="cursor:grab"/><text id="blueText" fill="#155489" font-size="17" font-weight="700">p₀</text><text id="greenText" fill="#107356" font-size="17" font-weight="700">p</text><text id="orangeText" fill="#ab641b" font-size="17" font-weight="700">Δp</text></svg>
<div class="toolbar smaller"><label><input id="showComps" type="checkbox" checked> Show components/grid</label><label><input id="showOrange" type="checkbox" checked> Show orange head-to-tail vector</label><label><input id="showValues" type="checkbox"> Reveal numerical result</label></div>
<div class="legend smaller"><span style="color:#2172b7">● Initial momentum p₀</span><span style="color:#11865f">● Final momentum p</span><span style="color:#d87719">● Change Δp / impulse J</span></div>
<div class="summary" style="margin-top:10px"><div><strong>Prediction challenge:</strong> <span id="prompt">Determine <span class="vec">Δp</span> from the diagram before revealing.</span></div><div class="toolbar"><label>Predicted x: <input id="guessx" type="number" step="0.1" style="width:85px"></label><label>Predicted y: <input id="guessy" type="number" step="0.1" style="width:85px"></label><button id="check">Check prediction</button></div><p id="feedback" role="status" class="smallcap" style="margin-bottom:0">Drag either coloured arrow tip, or type components above. Orange is the difference between tips.</p><div id="result" style="display:none;margin-top:10px;font-weight:750"></div></div>
</div><script>
const $=x=>document.getElementById(x),svg=$('plot'), S=22,OX=325,OY=194;
const controls=['x0','y0','x1','y1'].map($);let dragging=null,preset=-1,attempted=false;const cases=[[[4,0],[-2,0]],[[1,3],[-3,-2]],[[-4,0],[0,5]],[[3,-2],[-1,2]],[[0,-3],[5,1]]];
let line=(id,a,b)=>{let e=$(id);e.setAttribute('x1',a[0]);e.setAttribute('y1',a[1]);e.setAttribute('x2',b[0]);e.setAttribute('y2',b[1])};
let pt=(v)=>[OX+S*v[0],OY-S*v[1]];let vals=()=>controls.map(e=>Math.max(-8,Math.min(8,Number(e.value)||0)));
let initGrid=()=>{let c='';for(let i=-8;i<=8;i++){let x=OX+i*S,y=OY+i*S;c+=`<line x1="${x}" y1="18" x2="${x}" y2="370" stroke="#dceaf1" opacity=".85"/><line x1="149" y1="${y}" x2="501" y2="${y}" stroke="#dceaf1" opacity=".85"/>`;if(i%2===0){c+=`<text x="${x-5}" y="${OY+17}" font-size="11" fill="#7a95a4">${i}</text>`;if(i!==0)c+=`<text x="${OX+9}" y="${y+4}" font-size="11" fill="#7a95a4">${-i}</text>`}}c+=`<line x1="146" y1="194" x2="508" y2="194" stroke="#8195a3" stroke-width="2"/><line x1="325" y1="15" x2="325" y2="375" stroke="#8195a3" stroke-width="2"/><text x="510" y="185" font-size="12" fill="#344d60">pₓ</text><text x="334" y="21" font-size="12" fill="#344d60">pᵧ</text>`;$('grid').innerHTML=c};initGrid();
function update(){let [x0,y0,a,b]=vals(),mode=$('mode').value,fx=mode==='change'?a:x0+a,fy=mode==='change'?b:y0+b,dx=fx-x0,dy=fy-y0;let origin=pt([0,0]),first=pt([x0,y0]),last=pt([fx,fy]);line('blue',origin,first);line('green',origin,last);line('orange',first,last);$('hblue').setAttribute('cx',first[0]);$('hblue').setAttribute('cy',first[1]);$('hgreen').setAttribute('cx',last[0]);$('hgreen').setAttribute('cy',last[1]);$('blueText').setAttribute('x',first[0]+9);$('blueText').setAttribute('y',first[1]-8);$('greenText').setAttribute('x',last[0]+9);$('greenText').setAttribute('y',last[1]-8);$('orangeText').setAttribute('x',(first[0]+last[0])/2+7);$('orangeText').setAttribute('y',(first[1]+last[1])/2-9);$('orange').style.display=$('showOrange').checked?'':'none';$('orangeText').style.display=$('showOrange').checked?'':'none';$('grid').style.opacity=$('showComps').checked?'1':'.2';$('targetX').textContent=mode==='change'?'p x':'Δp x';$('targetY').textContent=mode==='change'?'p y':'Δp y';$('prompt').textContent=mode==='change'?'Determine Δp = p − p₀ using x/y components.':'Determine p = p₀ + Δp using x/y components.';let target=mode==='change'?[dx,dy]:[fx,fy],mag=Math.hypot(...target),angle=Math.atan2(target[1],target[0])*180/Math.PI;$('result').textContent=(mode==='change'?'Δp':'p')+` = (${target[0].toFixed(2)}, ${target[1].toFixed(2)}) kg·m/s; magnitude ${mag.toFixed(2)} kg·m/s; direction ${angle.toFixed(1)}° from +x`; $('result').style.display=$('showValues').checked?'block':'none';return target}
controls.forEach(el=>el.addEventListener('input',()=>{update();$('feedback').textContent='New vectors set. Make a fresh prediction.';$('showValues').checked=false;attempted=false;update()}));
$('mode').addEventListener('change',()=>{$('x0').value=3;$('y0').value=1;$('x1').value=$('mode').value==='change'?'-1':'-4';$('y1').value=$('mode').value==='change'?'4':'3';$('showValues').checked=false;attempted=false;update()});['showComps','showOrange'].forEach(id=>$(id).addEventListener('change',update));$('showValues').addEventListener('change',()=>{if(!attempted && $('showValues').checked){$('showValues').checked=false;$('feedback').textContent='Make a numerical prediction first, then use Check prediction before revealing the result.'}update()});
$('check').addEventListener('click',()=>{let tx=$('guessx').value,ty=$('guessy').value;if(tx===''||ty===''){$('feedback').textContent='Enter both x and y predictions before checking.';return}attempted=true;let target=update(),ok=Math.abs(Number(tx)-target[0])<.11&&Math.abs(Number(ty)-target[1])<.11;$('feedback').textContent=ok?'Correct. Note that each component carries a sign.':'Not yet. Check final minus initial in each coordinate. You can reveal to compare.';if(ok){$('showValues').checked=true;update()}});
$('reset').addEventListener('click',()=>{$('mode').value='change';[['x0',3],['y0',1],['x1',-1],['y1',4]].forEach(([id,v])=>$(id).value=v);$('guessx').value='';$('guessy').value='';$('showValues').checked=false;attempted=false;update()});
$('preset').addEventListener('click',()=>{preset=(preset+1)%cases.length;let [[x0,y0],[x1,y1]]=cases[preset];$('mode').value='change';[['x0',x0],['y0',y0],['x1',x1],['y1',y1]].forEach(([id,v])=>$(id).value=v);$('guessx').value='';$('guessy').value='';$('showValues').checked=false;$('feedback').textContent='Challenge '+(preset+1)+': determine the orange vector numerically.';update()});
let svgPos=e=>{let r=svg.getBoundingClientRect();let x=(e.clientX-r.left)*650/r.width,y=(e.clientY-r.top)*390/r.height;return [Math.max(-8,Math.min(8,Math.round((x-OX)/S*2)/2)),Math.max(-8,Math.min(8,Math.round((OY-y)/S*2)/2))]};
['hblue','hgreen'].forEach(id=>{let el=$(id);el.addEventListener('pointerdown',e=>{dragging=id;el.setPointerCapture(e.pointerId);e.preventDefault()});el.addEventListener('pointermove',e=>{if(dragging!==id)return;let [x,y]=svgPos(e),[x0,y0]=vals();if(id==='hblue'){$('x0').value=x;$('y0').value=y}else if($('mode').value==='change'){$('x1').value=x;$('y1').value=y}else{$('x1').value=x-x0;$('y1').value=y-y0}$('showValues').checked=false;attempted=false;update()});el.addEventListener('pointerup',()=>dragging=null);el.addEventListener('pointercancel',()=>dragging=null)});update();
</script></body></html>
